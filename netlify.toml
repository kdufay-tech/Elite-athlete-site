[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; worker-src 'self' blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.unsplash.com https://*.supabase.co; connect-src 'self' https://*.supabase.co https://api.stripe.com https://api.emailjs.com https://*.anthropic.com https://cdn.jsdelivr.net; frame-src https://js.stripe.com; media-src 'self' blob:;"

[functions]
  node_bundler = "esbuild"

# Timeouts: Netlify defaults to 10s. Only NON-paused functions are pinned here.
# The outreach functions (marketing-blast, marketing-broadcast, coach-followup,
# coach-ops-auto, beta-followup, beta-expiry-reminder, coach-ops-weekly) are
# deliberately omitted along with their schedules - see adf0a2d / council pause.
[functions."welcome-email"]
  timeout = 26
[functions."resend-webhook"]
  timeout = 26
[functions."send-beta-invite"]
  timeout = 26
[functions."coach-ops-metrics"]
  timeout = 26

[dev]
  command    = "npm run dev"
  framework  = "#custom"
  targetPort = 5173
  port       = 8888
  autoLaunch = false

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
