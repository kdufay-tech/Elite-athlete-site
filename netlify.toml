[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[dev]
  command    = "npm run dev"
  framework  = "#custom"
  targetPort = 5173
  port       = 8888
  autoLaunch = false

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200